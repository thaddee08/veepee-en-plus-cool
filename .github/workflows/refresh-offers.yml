name: Refresh sale feed

on:
  schedule:
    - cron: "23 4 * * *" # every day, before Germany wakes up
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-offers

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch sale items
        run: node scripts/fetch-offers.mjs
        env:
          AWIN_FEED_URLS: ${{ secrets.AWIN_FEED_URLS }}

      - name: Commit data/offers.json
        run: |
          if git diff --quiet -- data/offers.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json
          git commit -m "Refresh sale feed"
          git push
